name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Не отменяем уже начатую сборку новым коммитом: каждый запуск должен закончиться.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moi-posevnoy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # Публикуем APK только после успешной сборки.
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Мой Посевной — APK #${{ github.run_number }}
          body: |
            Автоматическая debug-сборка приложения «Мой Посевной».
            Коммит: ${{ github.sha }}

            Для установки скачайте APK-файл во вложениях этого релиза.
            Это тестовая debug-сборка, не подписанная ключом Google Play.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
